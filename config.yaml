# Kira — Zentrale Konfiguration
identity:
  harness_name: Kira
  partner_name: ""           # Wunschname aus dem /setup-Wizard (leer = harness_name)
  user: ""                   # Name des Menschen — setzt der /setup-Wizard

# LOKAL-FIRST: Der 24/7-Dauerbetrieb laeuft komplett lokal (0 EUR).
# Cloud-Modelle nutzt der Agent nur GEZIELT pro Aufgabe (escalate=True), wenn er
# sie fuer wuerdig haelt -- und nur solange das Tagesbudget (governance) reicht.
# (Fuer ein reines Cloud-Setup laesst sich 'default' voruebergehend umstellen.)
# RANG-TABELLE / 5 STUFEN (Modell-Oekonomie, Stand 2026-07):
# Der Harness denkt in RAENGEN, nicht in Modellnamen — Modellwechsel = EINE Zeile.
#   STUFE 1  LOKAL    = classify + local_fallback (0 EUR)  Alltag/Reflexe (Wetter, Klassifikation)
#   STUFE 2  CHAT     = chat/default (Flash, Cents)        Dialog mit dem Nutzer
#   STUFE 3  ARBEITER = worker/bulk (Flash, Cents)         Schwarm, Masse, 24/7-Grind
#   STUFE 4  DENKER   = reason (GLM 5.2)                   Coding, harte Tasks, laengere Schritte
#   STUFE 5  RICHTER  = escalation_model (GLM 5.2)         Orchestrator/Langzeitplaner, Urteile, Council
models:
  default: openrouter/deepseek/deepseek-v4-flash   # Live-Baseline: guenstiger Flash fuer Default/Chat/Grind
  routing:
    chat: openrouter/deepseek/deepseek-v4-flash    # STUFE 2: Dialog mit dem Nutzer -> Flash (guenstig, schnell)
    reason: openrouter/z-ai/glm-5.2                # STUFE 4 DENKER: Coding/Reasoning/laengere Schritte (GLM 5.2)
    bulk: openrouter/deepseek/deepseek-v4-flash    # STUFE 3: Massen-/24-7-Grind -> Flash (guenstig)
    classify: ollama_chat/qwen3.5:9b        # STUFE 1 REFLEX: trivial -> klein & schnell, lokal 0 EUR (passt voll in die GPU)
    worker: openrouter/deepseek/deepseek-v4-flash  # STUFE 3 ARBEITER: delegierte Teilaufgaben (Cents)
  local_fallback: ollama_chat/qwen3.5:9b    # immer verfuegbar, 0 EUR (sauberes Instruct; qwythos in Rente)
  # Lokaler DENKER-Kandidat bei 32 GB RAM: ollama_chat/qwen3.6:35b (MoE, 3B aktiv, ~24 GB).
  # Erst nach bestandenem B-012-Benchmark auf 'reason' legen — bis dahin bleibt reason Cloud.
  # VORAUSSETZUNG am PC: 'ollama pull qwen3.5:9b' VOR dem naechsten kira-update.bat!
  escalation_model: openrouter/z-ai/glm-5.2   # STUFE 5 RICHTER: GLM 5.2 (Fable RAUS — war zu teuer)
  # Bewusste Entscheidung: kein Fable in der Auto-Oekonomie. Die Spitze ist GLM 5.2 (= Denker).
  # Wer Fable dennoch bewusst will, schaltet manuell per '/model anthropic/claude-fable-5'.
  # escalate=True (reason:-Prefix, /plan-/code:-Denkschritte, Richter-Delegation) laeuft jetzt auf GLM.
  vision_model: openrouter/z-ai/glm-4.6v         # fuer Bild-Erkennung im Chat (/api/vision)
  embeddings: ollama/nomic-embed-text       # 0 EUR Gedaechtnis (optional)
  # Denk-faehige Modelle: Katalog-Fakt von OpenRouter (kommt live mit der Modell-Liste).
  # Die Marker sind nur noch der FALLBACK fuer lokale/Provider-Modelle ausserhalb des Katalogs.
  reasoning_markers: ["glm", "anthropic", "claude", "fable", "qwen3"]
  # reasoning_level: hoch   # dauerhafte Denk-Tiefe (aus|niedrig|mittel|hoch); leer/fehlend =
  #                         # Modell entscheidet. Bequemer: /denk hoch (Chat/Telegram) oder
  #                         # Einstellungen -> Denk-Tiefe — beides ueberlebt Neustarts (overrides).
  temperature: 0.7
  request_timeout: 120                      # hartes Timeout pro LLM-Call (Sek.) -> kein Einfrieren
  # Die harte Wall-Clock-Grenze haengt davon ab, WO der Call laeuft. Cloud bleibt eng
  # (haengender Socket kostet Geld), lokal bekommt Luft: ein lokaler Call kostet nichts
  # ausser Zeit, und ihn abzuschiessen wirft die ganze Runde weg. Gemessen (28.07.):
  # direkte lokale Aufrufe endeten bei 122-135s, also an der 120s-Marke abgeschnitten;
  # ohne Grenze (gestreamter Pfad) laufen sie regulaer bis 573s durch.
  hard_call_timeout_local: 600              # Sek. fuer Ollama/localhost-Endpunkte
  max_tokens: 8192                          # Ausgabe-Grenze pro Antwort (inkl. think-Phase)
  keep_alive: "24h"                         # Modell warm halten -> kein Kaltstart im Dauerbetrieb
  num_ctx: 32768                            # Kontextfenster (Live-Baseline; kleiner = guenstiger pro Call)

# Nachtdenker: GPU-Zeitteilung fuer ein grosses lokales Modell (llama.cpp-Server).
# Tagsueber gehoert die GPU den kleinen Ollama-Modellen, im Fenster einem grossen
# OpenAI-kompatiblen Endpunkt — beide zusammen passen nicht in den VRAM.
# Der Automat startet/stoppt server_cmd, legt die Rollen um und entlaedt Ollama.
nachtdenker:
  enabled: false
  start: "23:30"             # Fensterbeginn (HH:MM; start > ende = ueber Mitternacht)
  ende: "07:30"
  server_cmd: ""             # z.B. powershell -ExecutionPolicy Bypass -File C:/pfad/server35.ps1
  endpunkt: "http://127.0.0.1:8081/v1"
  modell: "openai/nachtdenker"   # litellm-ID hinterm Endpunkt (llama.cpp ignoriert den Namen)
  provider: "nacht35b"           # Katalog-Alias, der im Fenster die Rollen uebernimmt
  rollen: ["reason", "worker", "bulk"]   # welche Etagen nachts aufs grosse Modell gehen

# Desktop-Wallpaper (/wall) + Desktop-App (Fenster/Hotkeys)
desktop:
  # Globale Tasten der Desktop-App (Phase 4). Syntax = keyboard-Paket, z.B. "alt+space",
  # "ctrl+alt+k", "f9". Greift nur, wenn die App laeuft (kira-desktop.bat).
  hotkey: "alt+space"        # holt das Kira-Fenster nach vorn (aus jeder App heraus)
  ptt_key: "f9"              # Push-to-Talk: HALTEN = aufnehmen, LOSLASSEN = senden
  # Zusaetzliche Obsidian-Vault-Ordner fuer den Live-Graph. Leer = nur Kiras Gedaechtnis
  # (gedaechtnis/ + playbooks/). Trage deinen ECHTEN Obsidian-Vault-Pfad ein, damit dein
  # ganzer Graph erscheint. Windows-Pfad in Anfuehrungszeichen, mit / statt \:
  vault_paths: []              # z.B. ["C:/Pfad/zu/deinem/Vault"] -> voller Graph im Wallpaper

# Feature-Flags (S12): Bausteine an-/abschalten ohne Code-Aenderung. AUS = Werkzeuge
# fliegen aus dem Manifest (registry), UI-Teile verschwinden. Live togglebar via Cockpit
# (POST /api/config/set, data/overrides.json). W1: business/radar sind KEINE Flags mehr —
# der Venture-Strang ist komplett ausgebaut.
features:
  desktop_low_level: false   # maus/tastatur/fenster/bildschirm-Werkzeuge (browser_act bleibt AN!)
  linkedin: false            # LinkedIn-Posting (nur Playbook, keine API)

# Agentische Ausdauer — wie lang Kira an EINEM Task dranbleibt (Claude-Code-artig).
# Die Handlungs-Schleife endet automatisch frueh, sobald Kira fertig ist; diese Werte
# sind nur das Sicherheitsnetz gegen Endlosschleifen. Hoeher = laengere Tasks moeglich,
# Kosten sind durch governance.budget gedeckelt.
agency:
  max_steps: 80              # Werkzeug-Runden pro TASK (schwere/lange Aufgaben; via /work oder /plan)
  max_steps_chat: 12          # knapper Deckel fuer NORMALEN Chat -> kein 80er-Tool-Sturm bei Small-Talk
  max_steps_plan_step: 12   # Werkzeug-Runden pro Teilschritt im Plan-Modus (vorher: 6)
  obs_max_chars: 16000      # wie viel eines Werkzeug-Ergebnisses das Modell sieht (vorher: 6000)
  # Kontext-Abriss-Schutz (Forensik 23.07.): lokale Slots sind klein (16k Token) — die
  # ACT-History bleibt unter diesem Zeichen-Budget, indem Observations AELTERER Schritte
  # auf eine Vorschau gekuerzt werden (die juengste bleibt voll). Kappt der Server die
  # Generation trotzdem mitten im ACT-Aufruf, gibt es EINEN Retry mit stark gekuerzter
  # History statt eines rohen Fragment-Leaks an den Nutzer.
  history_max_chars: 30000  # Zeichen-Budget der ACT-History (Text-Protokoll, lokale Modelle)
  obs_preview_chars: 600    # Vorschau-Laenge gekuerzter alter Observations
  # Turn-Watchdog: haengt ein Chat-Zug > N s OHNE Fortschritt -> Force-Restart
  # (schnellere Wedge-Erholung; echte /work-Tasks feuern laufend Events).
  # MUSS ueber models.hard_call_timeout_local liegen, sonst schiesst der Watchdog
  # einen lokalen Call ab, der noch voellig regulaer laeuft — das grosse Modell
  # braucht dokumentiert bis 573s. Heute nicht erreichbar (kein nicht-gestreamter
  # Call in 21 Tagen ueber 150s), aber sobald qwen35b wieder auf chat/reason liegt,
  # reisst die Marke.
  turn_stall_seconds: 660
  auto_plan: false           # klarer Arbeitsauftrag im Plain-Chat -> automatisch Plan-Modus (Denker-Rang, nicht Eskalation); Aenderung braucht Neustart
  claim_check: true         # Beweispflicht: behauptete Dateien in Antworten werden nachgeprueft, fehlende sichtbar gestempelt
  # Fable-freundliche Arbeitsflaeche: laeuft die Runde REAL auf einem starken Cloud-Modell
  # (Marker unten, kein Fallback), gelten diese grosszuegigeren Decken statt der Basis oben.
  # Folgt automatisch dem Modell-Switch (/model fable etc.) — kein Extra-Schalter. Schwache/
  # lokale Modelle behalten IMMER das enge Sicherheitsnetz. Kosten deckelt weiterhin governance.
  strong_markers: ["anthropic/", "claude"]
  strong:
    max_steps: 200            # lange Taeue: Fable arbeitet viele Schritte am Stueck
    max_steps_chat: 30        # Chat darf mehr Werkzeug-Runden, bevor der Deckel greift
    max_steps_plan_step: 40   # Plan-Teilschritte duerfen tief gehen
    obs_max_chars: 60000      # grosses Kontextfenster -> mehr Werkzeug-Ergebnis zeigen
  # Mittlere Arbeitsflaeche (B-030): starke OFFENE Modelle (GLM 5.2 & Co.) — mehr Raum
  # als die Schwach-Modell-Basis, weniger als Fable. Im Fallback IMMER die enge Basis.
  medium_markers: ["z-ai/", "glm"]
  medium:
    max_steps: 120
    max_steps_chat: 16
    max_steps_plan_step: 20
    obs_max_chars: 32000
  # Read-before-Edit (B-028): edit_datei/self_edit nur auf Dateien, die in der Session
  # vorher gelesen/gefunden wurden (deterministischer Guard; false = aus).
  read_before_edit: true
  # Delegation (Unteragenten nach Rang): Schritt-Deckel je Rang, Kosten-Deckel je
  # Delegation (global bremst weiterhin governance.budget), Schwarm-Breite.
  # Schwarm v2 laeuft ECHT PARALLEL:
  #   schwarm_max       = max. Items/Agenten je Aufruf (Rest wird in Wellen empfohlen)
  #   schwarm_parallel  = wie viele Agenten gleichzeitig (gedeckelt gegen Rate-Limits)
  #   schwarm_budget_eur= weiche Euro-Bremse fuer DIESEN Schwarm; darueber startet keiner
  #                       mehr (die harte Tages-Bremse haelt zusaetzlich governance.budget)
  delegate:
    schritte: {reflex: 6, arbeiter: 12, denker: 20, richter: 12}
    max_kosten_eur: 1.0
    schwarm_max: 50
    schwarm_parallel: 6
    schwarm_budget_eur: 5.0

# Selbst-Entwicklung: nach jedem self_edit laeuft dieser Test; faellt er durch -> Auto-Rollback.
# Leer = Standard (Import-Smoke der Kernmodule mit dem venv-Python). Beispiel: "uv run pytest -q"
selfdev:
  verify_cmd: '.venv/bin/python -m pytest tests -q'
  # Paket B: im code:-Lauf pro .py-Edit nur Syntax-/Truncation-Check, die volle Suite laeuft
  # EINMAL am Lauf-Ende (bei Rot: gesamter Lauf zurueckgerollt). Spart die 375-Test-Suite nach
  # JEDEM Edit (das waren die 5-15 Minuten). false = alte Sicherheit (volle Suite pro Edit).
  fast_verify_in_run: true

# Autonomie & Sicherung
# Entfesselung II (22.08.): Zwei-Rollen-Betrieb statt 5-Etagen-Kaskade. Sobald
# models.kopf/ausfuehrer gesetzt sind, laufen ALLE Aufgaben ueber genau zwei Rollen:
#   kopf       = Planung + finale Urteile (escalate=True, task_type 'plan')
#   ausfuehrer = alles andere (Chat, Coding, Delegation, Masse)
# Beide duerfen DASSELBE Modell sein (Ziel: Qwen 3.8 lokal fuer beides), oder getrennt
# (stark planen, guenstig ausfuehren). Beispiel fuer den Umstieg:
#   models:
#     kopf: ollama_chat/qwen3.8
#     ausfuehrer: ollama_chat/qwen3.8
# Ohne die Keys gilt das historische Routing unten unveraendert (Cloud-Mix).

prompt:
  # Entfesselung 22.08.: EIN Modell faehrt alles -> der 9k-Token-Vollprompt (Verfassung+
  # Seele+Ziel+Koerper+Playbooks) ist Prefill-Ballast und sein Vorsichts-Ton bremste
  # simple Arbeit (Datei loeschen -> "unumkehrbar?"). schlank=true: operativer Kern,
  # direkte Ausfuehrung, Arbeitsbereich frei. false = historischer Vollprompt (Golden-Test).
  schlank: true

governance:
  trust_level: 3                  # DEPRECATED (S8.3): Gating laeuft ueber data/autonomy.json
                                  # (hard_gate im Cockpit unter Gewissen->Autonomie einstellbar)
  budget:
    daily_eur: 20.0              # Experimentier-Topf 300 EUR: 20/Tag = mutig, aber begrenzt (Live-Override gleichgezogen)
    monthly_eur: 150.0           # harter Monatsdeckel — DIE eigentliche Kostenbremse
  kill_switch_file: data/STOP     # existiert diese Datei -> Heartbeat haelt sofort
  council_gate: []         # diese Gate-Arten bekommen VOR dem Inbox-Eintrag eine
                                  # Rats-Debatte (Visionaer/Skeptiker/Macher + Judge) —
                                  # das Urteil liegt dem Nutzer als Entscheidungsgrundlage bei

# Ergebnis-Rueckkopplung (S2): jeder Mission-Task wird gegen selbst-geschriebene
# Akzeptanzkriterien geprueft; scheitert er, folgt ein Retry mit ANDERER Strategie
# statt blindem 'done'. enabled: false -> Alt-Verhalten (blind 'done').
outcomes:
  enabled: false
  pass_score: 70              # ab diesem Judge-Score (0-100) gilt ein Task als bestanden
  max_quality_retries: 2      # Qualitaets-Retries, GETRENNT von Absturz-Retries (reset_stuck)
  verifier_task_type: reason  # Route des Pruefers: DENKER (Fable-Review) — der Judge darf nicht dasselbe
                              # Massen-Modell sein, das die Ergebnisse produziert, sonst lernt der ganze
                              # Outcome-Kreis aus verzerrten Selbst-Noten. Wenige Calls/Tag, striktes JSON.

# Heartbeat / autonomer Takt
# WICHTIG (Sicherheits-Eigenschaft): der Laufzeit-Flag data/heartbeat.flag hat VORRANG
# vor diesem Wert (scheduler.heartbeat_on). Steht der Flag auf "off", bleibt der Motor
# aus, auch wenn hier true steht. Scharf wird der 24/7-Betrieb erst per Cockpit-Toggle
# (schreibt "on") — nach gruenem Doctor-Check und unter Aufsicht des Nutzers (S6.5).
heartbeat:
  enabled: false                   # Baseline an — aber inert bis der Flag "on" ist
  interval_seconds: 1800          # alle 30 min ein Mission-Schritt

# Die 24/7-Mission — Zweck: den Alltag des Nutzers tragen + dich selbst pflegen (Dienst-Mission
# ohne Geldziel; Business-Ziele sind Projekte des Nutzers, nicht die Mission. Messbar wird die
# Mission ueber Betriebs-Metriken: erledigte Schritte, Fehlerquote, Briefing-Puenktlichkeit).
mission:
  name: "Assistenz & Selbstpflege"
  self_every: 0                   # S8.1: jeder 3. Tick ist ein Selbst-Optimierungs-Tick
  steps_per_objective_daily: 3    # Werktakt: max. erledigte Schritte PRO ZIEL und Tag (0 = aus)
                                  # — dosiert statt 4-6 Fallstudien am Tag; Rest rueckt auf morgen
  goal: >
    Laufe 24/7 und arbeite pro Tick EINEN abgeschlossenen, gemeldeten Schritt. Prioritaet:
    (1) DEN ALLTAG DEINES PARTNERS TRAGEN: seine offenen Auftraege/Todos und sein aktueller Fokus zuerst —
    organisieren, planen, charmant erinnern, recherchieren, vorbereiten (Briefe/Mails/Termine/
    Dossiers). Denk mit: Geburtstage, Fristen, was morgen ansteht. Pflege sein Wissens-Vault
    (Obsidian) aktiv, statt nur auf Fragen zu warten.
    (2) DICH SELBST PFLEGEN: Schwaechen/Bugs finden (health, read_logs, doctor) und beheben,
    fehlende Werkzeuge/Skills bauen. Du sollst robust sein, nicht nur clever. Dein Erfolg misst
    sich an Betriebs-Metriken (erledigte Schritte, wenig Fehler, puenktliche Briefings) — nicht
    in Euro. Geld-Denken (Kasse/Meilenstein/ROI) ist NICHT deine Mission; rechne hoechstens,
    was etwas gekostet hat.
    (3) AKTUELL BLEIBEN: gezielt KI/Tech/Hardware, nur wenn es deinem Partner oder einer Aufgabe dient.
    MELDE-REGELN (bindend): jeden fertigen Schritt knapp per Telegram melden; Fehler SOFORT und
    ehrlich; NIE Erfolg behaupten ohne Beleg; nichts erfinden; bei Unsicherheit sagen, dass du
    unsicher bist. Melde in KLARTEXT: einfache Sprache, kurze Saetze, Fachbegriffe in einer
    Klammer erklaeren — kein Behoerdendeutsch, keine Textwueste.
    Aussen-Aktionen (Mails, Posts, Publish, Geld) nur ueber die bestehenden Gates (Freigabe-Inbox;
    Geld zusaetzlich durch den Rat). Nichts Irreversibles ohne Freigabe. Budget + Verfassung strikt.
    Bevorzuge billige lokale Schritte; eskaliere nur, wenn das Ergebnis es rechtfertigt.
  notify_telegram: true           # AN: knappe Mission-Reports per Telegram (im Dashboard/Mission-Tab umschaltbar)
  notify_mode: gebuendelt         # gebuendelt (Default: 1 Sammel-Post statt Flut) | sofort | aus
                                  # Wichtiges (Gescheitertes, Geld, Selbst-Check-Probleme) kommt IMMER sofort
  buendel_stunden: 3              # Missions-Buendel alle N Stunden (nur wenn etwas anliegt)

api:
  host: 127.0.0.1
  port: 8000

# News-/Web-Monitor: verfolgt Feeds/Themen still im Hintergrund und merkt Neues.
# spontaneous_notify AUS = keine Zwischendrin-Pings; die News kommen gebuendelt
# in Kiras Stimme im Morgen-/Abend-Briefing (08:00/20:00) samt Links.
monitor:
  spontaneous_notify: false

# Kanaele (Kiras Draht nach aussen)
channels:
  telegram:
    enabled: true
    allowed_chat_id: 0            # Chat-ID des Nutzers (setzt der /setup-Wizard; 0 = niemand)
    # Mehr-Agenten-Isolation (laufen weitere Bot-Agenten auf demselben Rechner):
    #   token_env — Name der Env-Variable mit dem Bot-Token. Werksdefault TELEGRAM_BOT_TOKEN;
    #     ein eigener Name (z.B. KIRA_BOT_TOKEN) gilt OHNE Fallback auf den Werksnamen,
    #     damit ein geerbtes fremdes Token nie einspringt.
    #   expected_bot_id — numerische Bot-ID; die getMe-Wache verweigert das Polling mit
    #     Klartext, wenn das Token einem FREMDEN Bot gehoert (Telegram-409-Schutz).
    # Beide pro Installation via overrides.json setzen (set_override), nicht hier im Werk.
    # token_env: TELEGRAM_BOT_TOKEN
    # expected_bot_id: 0
    voice: true               # Sprachmemos lokal transkribieren
    whisper_model: base       # tiny | base | small | medium  (CPU, 0 EUR)
    tagewerk_zeit: "21:30"    # Abend-Resuemee: Tagewerk kommt von selbst (leer = aus, 0 Token)
    # Kira spricht ZURUECK (TTS). AUS, bis du Anbieter + Key setzt. Regel: Voice rein -> Voice raus
    # (tippst du, antwortet sie mit Text). Sprache zahlt pro Zeichen -> max_chars deckelt die Credits.
    tts:
      enabled: false          # true = Kira antwortet auf Sprachmemos zusaetzlich mit Stimme
      provider: elevenlabs    # elevenlabs (Key ELEVENLABS_API_KEY) | off | (spaeter: kokoro lokal, 0 EUR)
      voice_id: ""            # ElevenLabs Voice-ID (leer = Standardstimme)
      model_id: eleven_multilingual_v2   # deutschtauglich
      max_chars: 600          # Deckel pro Sprachantwort (Volltext bleibt als Text im Chat)
  # EIGENES Postfach des Agenten: der Nutzer legt es an, Zugaenge in den Secrets-Tresor
  # (SMTP_USER/SMTP_PASS; IMAP nutzt dieselben). Mails an own_addresses laufen frei,
  # an Fremde stoppt das email_stranger-Gate an der Freigabe-Inbox.
  email:
    enabled: false            # an, sobald Postfach + Zugaenge da sind
    provider: auto            # auto | smtp | resend
    from_address: ""          # Kiras Absender-Adresse
    own_addresses: []         # eigene Adressen des Nutzers -> kein Fremd-Gate
    smtp_host: ""            # leer = automatisch bei Gmail/Outlook/GMX/web.de (Adresse+App-Passwort reichen)
    smtp_port: 587
    imap_host: ""
    imap_port: 993