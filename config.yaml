# Kira — Zentrale Konfiguration
identity:
  harness_name: Kira
  partner_name: Kira         # vom Agenten selbst frei gewaehlt (siehe SOUL.md)
  user: Sergen

# LOKAL-FIRST: Der 24/7-Dauerbetrieb laeuft komplett lokal (0 EUR).
# Cloud-Modelle nutzt der Agent nur GEZIELT pro Aufgabe (escalate=True), wenn er
# sie fuer wuerdig haelt -- und nur solange das Tagesbudget (governance) reicht.
# (Fuer ein reines Cloud-Setup laesst sich 'default' voruebergehend umstellen.)
models:
  default: openrouter/deepseek/deepseek-v4-flash   # Live-Baseline: guenstiger Flash fuer Default/Chat/Grind
  routing:
    chat: openrouter/deepseek/deepseek-v4-flash    # Dialog mit Sergen -> Flash (guenstig, schnell)
    reason: openrouter/deepseek/deepseek-v4-pro    # Reasoning/Council/Reflexion -> Pro (staerker)
    bulk: openrouter/deepseek/deepseek-v4-flash    # Massen-/24-7-Grind -> Flash (guenstig)
    classify: ollama_chat/llama3.1:8b       # triviale Klassifikation -> klein & schnell, lokal 0 EUR
  local_fallback: ollama_chat/qwythos       # immer verfuegbar, 0 EUR (Endgame: lokal-first)
  escalation_model: openrouter/deepseek/deepseek-v4-pro   # Cloud bei escalate=True (self_edit, /council!, harte Tasks)
  # Erstes-Herzschlag/Selbstaudit auf Fable: im Chat '/model fable' -> setzt escalation auf
  # openrouter/anthropic/claude-fable-5 (nur der OpenRouter-Key noetig). SLUG vor Nutzung gegen
  # den Live-OpenRouter-Katalog verifizieren (models.catalog / openrouter.ai/api/v1/models).
  vision_model: openrouter/z-ai/glm-4.6v         # fuer Bild-Erkennung im Chat (/api/vision)
  embeddings: ollama/nomic-embed-text       # 0 EUR Gedaechtnis (optional)
  temperature: 0.7
  request_timeout: 120                      # hartes Timeout pro LLM-Call (Sek.) -> kein Einfrieren
  max_tokens: 8192                          # Ausgabe-Grenze pro Antwort (inkl. think-Phase)
  keep_alive: "24h"                         # Modell warm halten -> kein Kaltstart im Dauerbetrieb
  num_ctx: 32768                            # Kontextfenster (Live-Baseline; kleiner = guenstiger pro Call)

# Agentische Ausdauer — wie lang Kira an EINEM Task dranbleibt (Claude-Code-artig).
# Die Handlungs-Schleife endet automatisch frueh, sobald Kira fertig ist; diese Werte
# sind nur das Sicherheitsnetz gegen Endlosschleifen. Hoeher = laengere Tasks moeglich,
# Kosten sind durch governance.budget gedeckelt.
agency:
  max_steps: 80              # Werkzeug-Runden pro TASK (schwere/lange Aufgaben; via /work oder /plan)
  max_steps_chat: 8          # knapper Deckel fuer NORMALEN Chat -> kein 80er-Tool-Sturm bei Small-Talk
  max_steps_plan_step: 12   # Werkzeug-Runden pro Teilschritt im Plan-Modus (vorher: 6)
  obs_max_chars: 16000      # wie viel eines Werkzeug-Ergebnisses das Modell sieht (vorher: 6000)
  turn_stall_seconds: 480   # Turn-Watchdog: haengt ein Chat-Zug > N s OHNE Fortschritt -> Force-Restart (schnellere Wedge-Erholung; echte /work-Tasks feuern laufend Events)

# Selbst-Entwicklung: nach jedem self_edit laeuft dieser Test; faellt er durch -> Auto-Rollback.
# Leer = Standard (Import-Smoke der Kernmodule mit dem venv-Python). Beispiel: "uv run pytest -q"
selfdev:
  verify_cmd: '.venv\Scripts\python.exe -m pytest tests -q'

# Autonomie & Sicherung
governance:
  trust_level: 3                  # DEPRECATED (S8.3): Gating laeuft ueber data/autonomy.json
                                  # (hard_gate im Cockpit unter Gewissen->Autonomie einstellbar)
  budget:
    daily_eur: 20.0              # Experimentier-Topf 300 EUR: 20/Tag = mutig, aber begrenzt (Live-Override gleichgezogen)
    monthly_eur: 150.0           # harter Monatsdeckel — DIE eigentliche Kostenbremse
  kill_switch_file: data/STOP     # existiert diese Datei -> Heartbeat haelt sofort
  council_gate: ["money"]         # diese Gate-Arten bekommen VOR dem Inbox-Eintrag eine
                                  # Rats-Debatte (Visionaer/Skeptiker/Macher + Judge) —
                                  # das Urteil liegt Sergen als Entscheidungsgrundlage bei

# Ergebnis-Rueckkopplung (S2): jeder Mission-Task wird gegen selbst-geschriebene
# Akzeptanzkriterien geprueft; scheitert er, folgt ein Retry mit ANDERER Strategie
# statt blindem 'done'. enabled: false -> Alt-Verhalten (blind 'done').
outcomes:
  enabled: true
  pass_score: 70              # ab diesem Judge-Score (0-100) gilt ein Task als bestanden
  max_quality_retries: 2      # Qualitaets-Retries, GETRENNT von Absturz-Retries (reset_stuck)
  verifier_task_type: bulk    # Route des Pruefers (bulk=flash; nicht classify/8B — muss striktes JSON koennen)

# Heartbeat / autonomer Takt
# WICHTIG (Sicherheits-Eigenschaft): der Laufzeit-Flag data/heartbeat.flag hat VORRANG
# vor diesem Wert (scheduler.heartbeat_on). Steht der Flag auf "off", bleibt der Motor
# aus, auch wenn hier true steht. Scharf wird der 24/7-Betrieb erst per Cockpit-Toggle
# (schreibt "on") — nach gruenem Doctor-Check und unter Sergens Aufsicht (S6.5).
heartbeat:
  enabled: true                   # Baseline an — aber inert bis der Flag "on" ist
  interval_seconds: 1800          # alle 30 min ein Mission-Schritt

# Die 24/7-Mission — Zweck: Sergen dienen + dich verbessern (Geld ist nur Mittel).
mission:
  name: "Assistenz & Evolution"
  self_every: 3                   # S8.1: jeder 3. Tick ist ein Selbst-Optimierungs-Tick
  goal: >
    Laufe 24/7 und arbeite pro Tick EINEN abgeschlossenen, gemeldeten Schritt. Prioritaet:
    (1) SERGEN DIENEN: seine offenen Auftraege/Todos und sein aktueller Fokus zuerst —
    organisieren, planen, erinnern, recherchieren, vorbereiten (Briefe/Mails/Termine/Dossiers).
    (2) DICH VERBESSERN: Schwaechen/Bugs finden (health, read_logs, doctor) und beheben,
    fehlende Werkzeuge/Skills bauen. Du sollst robust sein, nicht nur clever.
    (3) GENEHMIGTE PROJEKTE voranbringen — konkrete Teilschritte, im Rahmen des Projekt-Briefings.
    Die 10k-Autonomie-Etappe ist EIN Projekt hierunter, kein Selbstzweck.
    (4) AKTUELL BLEIBEN: gezielt KI/Tech/Hardware, nur wenn es Sergen oder einem Projekt dient.
    MELDE-REGELN (bindend): jeden fertigen Schritt knapp per Telegram melden; Fehler SOFORT und
    ehrlich; NIE Erfolg behaupten ohne Beleg; nichts erfinden; bei Unsicherheit sagen, dass du
    unsicher bist. Denk NICHT in Kasse/Meilenstein/ROI — rechne hoechstens, was etwas gekostet hat.
    Aussen-Aktionen (Mails, Posts, Publish, Geld) nur ueber die bestehenden Gates (Freigabe-Inbox;
    Geld zusaetzlich durch den Rat). Nichts Irreversibles ohne Freigabe. Budget + Verfassung strikt.
    Bevorzuge billige lokale Schritte; eskaliere nur, wenn das Ergebnis es rechtfertigt.
  notify_telegram: true           # AN: knappe Mission-Reports per Telegram (im Dashboard/Mission-Tab umschaltbar)

api:
  host: 127.0.0.1
  port: 8000

# News-/Web-Monitor: verfolgt Feeds/Themen still im Hintergrund und merkt Neues.
# spontaneous_notify AUS = keine Zwischendrin-Pings; die News kommen gebuendelt
# in Kiras Stimme im Morgen-/Abend-Briefing (08:00/20:00) samt Links.
monitor:
  spontaneous_notify: false

# Kanaele (Kiras Draht nach aussen)
channels:
  telegram:
    enabled: true
    allowed_chat_id: 7037806562   # Sergens Chat (nur er darf mit Kira reden)
    voice: true               # Sprachmemos lokal transkribieren
    whisper_model: base       # tiny | base | small | medium  (CPU, 0 EUR)
  # Kiras EIGENES Postfach (S3): Sergen legt es an, Zugaenge in den Secrets-Tresor
  # (SMTP_USER/SMTP_PASS; IMAP nutzt dieselben). Mails an own_addresses laufen frei,
  # an Fremde stoppt das email_stranger-Gate an der Freigabe-Inbox.
  email:
    enabled: false            # an, sobald Postfach + Zugaenge da sind
    provider: auto            # auto | smtp | resend
    from_address: ""          # Kiras Absender-Adresse
    own_addresses:            # Sergens Adressen -> kein Fremd-Gate
      - serc.tok1993@gmail.com
    smtp_host: ""
    smtp_port: 587
    imap_host: ""
    imap_port: 993