# Prometheus — Zentrale Konfiguration
identity:
  harness_name: Prometheus
  partner_name: Kyros         # vom Agenten selbst frei gewaehlt (siehe SOUL.md)
  user: Sergen

# LOKAL-FIRST: Der 24/7-Dauerbetrieb laeuft komplett lokal (0 EUR).
# Cloud-Modelle nutzt der Agent nur GEZIELT pro Aufgabe (escalate=True), wenn er
# sie fuer wuerdig haelt -- und nur solange das Tagesbudget (governance) reicht.
# (Fuer ein reines Cloud-Setup laesst sich 'default' voruebergehend umstellen.)
models:
  default: ollama_chat/qwythos              # Kyros' Hirn: Qwythos-9B (Claude-Stil), 0 EUR
  routing:
    chat: ollama_chat/qwythos               # Dialog mit Sergen -> Qwythos
    reason: ollama_chat/qwythos             # Reasoning/Council/Reflexion -> Qwythos
    bulk: ollama_chat/qwythos               # Massen-/Routine-Tasks -> Qwythos
    classify: ollama_chat/llama3.1:8b       # triviale Klassifikation -> klein & schnell
  local_fallback: ollama_chat/qwythos       # immer verfuegbar, 0 EUR
  escalation_model: anthropic/claude-opus-4-8   # Cloud NUR bei escalate=True
  embeddings: ollama/nomic-embed-text       # 0 EUR Gedaechtnis (optional)
  temperature: 0.7
  max_tokens: 4096                          # Raum fuer <think>-Phase + Antwort
  keep_alive: "24h"                         # Modell warm halten -> kein Kaltstart im Dauerbetrieb
  num_ctx: 8192                             # Kontextfenster (Arbeitsgedaechtnis) -> Platz fuer Prompt + Erinnerungen

# Autonomie & Sicherung (greift voll ab Phase 5)
governance:
  trust_level: 3                  # voll-autonom (Nutzerwahl)
  budget:
    daily_eur: 5.0                # klein starten, waechst mit nachgewiesenem ROI
    monthly_eur: 50.0
  kill_switch_file: data/STOP     # existiert diese Datei -> Heartbeat haelt sofort

# Heartbeat / autonomer Takt
heartbeat:
  enabled: false                  # in Phase 1 noch aus; manueller Chat zuerst
  interval_seconds: 900

api:
  host: 127.0.0.1
  port: 8000

# Kanaele (Kyros' Draht nach aussen)
channels:
  telegram:
    enabled: true
    allowed_chat_id: 7037806562   # Sergens Chat (nur er darf mit Kyros reden)
    voice: true               # Sprachmemos lokal transkribieren
    whisper_model: base       # tiny | base | small | medium  (CPU, 0 EUR)
