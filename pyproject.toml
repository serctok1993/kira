[project]
name = "prometheus"
version = "0.1.0"
description = "Persönlicher autonomer Agent-Harness — ein Partner, kein Werkzeug."
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.55",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "faster-whisper>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
