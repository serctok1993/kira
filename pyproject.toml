[project]
name = "prometheus"
version = "0.1.0"
description = "Persönlicher autonomer Agent-Harness — ein Partner, kein Werkzeug."
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.55",
    "tenacity>=8.0",  # litellm-Retry-Pfad (num_retries) importiert tenacity lazy — ohne = harter Fehler statt Retry
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "faster-whisper>=1.0",
    "playwright>=1.61.0",
    "mcp>=1.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
